name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_ID: "1"
      BOT_TOKEN: "test:token"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt pip-audit bandit
      - run: python -m unittest discover -v
      - run: pip-audit -r requirements.txt
      - run: bandit -q -r . -x ./.venv,./frontend -lll
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - name: Build immutable release artifact
        run: |
          RELEASE_ARCHIVE="$RUNNER_TEMP/apex-crm-release.tar.gz"
          tar --exclude-vcs --exclude='.env' --exclude='.venv' --exclude='frontend/node_modules' \
            --exclude='*.sqlite3' --exclude='uploads' --exclude='backups' --exclude='*.log' \
            --exclude='*.tar.gz' -czf "$RELEASE_ARCHIVE" .
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          RELEASE_ID="$(git rev-parse HEAD)"
          scp -i ~/.ssh/deploy_key "$RUNNER_TEMP/apex-crm-release.tar.gz" deployment/deploy_release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/deploy_release.sh '$RELEASE_ID' /tmp/apex-crm-release.tar.gz"
